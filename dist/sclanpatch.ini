; SC LAN Patch - Konfiguration
; Diese Datei liegt neben Stronghold_Crusader_Extreme.exe / Stronghold Crusader.exe.
; Alle Werte sind optional, die Standardwerte passen fuer normale Heimnetze.

[LANPatch]
; 0 = Patch komplett aus (DLL reicht dann nur an DirectPlay durch)
Enabled=1

; TCP-Port der Nachbarsuche. Muss auf allen PCs gleich sein.
DiscoveryPort=47630

; Feste Mitspieler (IP oder Hostname, mit Komma getrennt).
; Noetig nur, wenn ihr NICHT im selben Subnetz seid - z.B. Tailscale/ZeroTier/
; Hamachi oder zwei Router. Beispiel: Peers=100.101.102.103, spiele-pc.local
Peers=

; Lokale Subnetze per TCP nach anderen Patch-Installationen absuchen.
SubnetScan=1
; Netze groesser als /22 werden nur im eigenen /24 abgesucht.
MaxScanPrefix=22
ScanIntervalMs=3000
ConnectTimeoutMs=400

; DirectPlay-Broadcast ueber ALLE Netzwerkadapter schicken (statt nur ueber einen).
BroadcastAllAdapters=1
; Spielsuche zusaetzlich direkt (Unicast) an jeden gefundenen Mitspieler senden.
UnicastToPeers=1

; Stabilitaet der Spielverbindung
TcpNoDelay=1
TcpKeepAlive=1

; Eigene Adresse: echte LAN-Karte vor virtuellen Adaptern (VirtualBox, Hyper-V,
; Docker, VPN ...) melden. PreferredIP erzwingt eine bestimmte Adresse.
PreferLanAddress=1
PreferredIP=
; Adapter ignorieren, deren Name einen dieser Begriffe enthaelt (Komma-getrennt)
IgnoreAdapters=

; Protokoll in sclanpatch.log schreiben
Log=1
